substitutions:
  device_origin: !secret device_origin

external_components:
  - source:
      type: local
      path: vendor/parkghost-esphome-epaper/components
    components: [epaper_spi]

esphome:
  name: family-dashboard
  friendly_name: Family Dashboard
  on_boot:
    - priority: 800
      then:
        - script.execute: status_led_awake
        - lambda: |-
            pinMode(2, INPUT_PULLUP);
            id(maintenance_mode) = digitalRead(2) == LOW;
    - priority: -100
      then:
        - if:
            condition:
              lambda: "return id(maintenance_mode);"
            then:
              - logger.log:
                  level: WARN
                  format: "Maintenance mode active; deep sleep is disabled"
            else:
              - delay: 75s
              - script.execute: handle_update_failure

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: request_view_set_if_ready

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: dashboard_time
    timezone: America/Los_Angeles
    on_time:
      - seconds: 0
        minutes: 32
        hours: 6,10
        then:
          - script.execute: scheduled_image_refresh
      - seconds: 0
        minutes: 2
        hours: 15,19
        then:
          - script.execute: scheduled_image_refresh

interval:
  - interval: 1min
    startup_delay: 1min
    then:
      - script.execute: request_view_set_if_ready

output:
  - platform: gpio
    id: status_led
    # GPIO21 is also the XIAO Plus microSD chip-select; keep the slot empty.
    pin:
      number: GPIO21
      inverted: true

logger:
  level: WARN

http_request:
  id: dashboard_http
  follow_redirects: false
  timeout: 10s
  verify_ssl: true
  buffer_size_rx: 1024

globals:
  - id: request_finished
    type: bool
    restore_value: false
    initial_value: "false"
  - id: request_started
    type: bool
    restore_value: false
    initial_value: "false"
  - id: active_slot
    type: int
    restore_value: false
    initial_value: "0"
  - id: staging_slot
    type: int
    restore_value: false
    initial_value: "1"
  - id: selected_view
    type: int
    restore_value: false
    initial_value: "0"
  - id: reset_display_to_daily
    type: bool
    restore_value: false
    initial_value: "false"
  - id: has_active_view_set
    type: bool
    restore_value: false
    initial_value: "false"
  - id: daily_metadata_status
    type: int
    restore_value: false
    initial_value: "0"
  - id: staging_generation
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: daily_generation
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: active_daily_etag
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: active_calendar_etag
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: staged_daily_etag
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: staged_calendar_etag
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: maintenance_mode
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: status_led_fast_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - output.turn_on: status_led
            - delay: 100ms
            - output.turn_off: status_led
            - delay: 100ms

  - id: status_led_awake
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - output.turn_on: status_led

  - id: status_led_downloading
    mode: restart
    then:
      - script.execute: status_led_fast_blink

  - id: status_led_refreshing
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - output.turn_on: status_led

  - id: status_led_error
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - repeat:
          count: 3
          then:
            - output.turn_on: status_led
            - delay: 120ms
            - output.turn_off: status_led
            - delay: 120ms

  - id: update_timeout
    mode: restart
    then:
      - delay: 75s
      - script.execute: handle_update_failure

  - id: request_view_set_if_ready
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(maintenance_mode) &&
                     !id(request_started);
          then:
            - lambda: |-
                id(request_started) = true;
                id(request_finished) = false;
                id(staging_slot) = 1 - id(active_slot);
                id(daily_metadata_status) = 0;
                id(daily_generation).clear();
                id(staging_generation).clear();
                id(staged_daily_etag).clear();
                id(staged_calendar_etag).clear();
            - script.execute: status_led_downloading
            - script.execute: update_timeout
            - http_request.get:
                url: "${device_origin}/api/image"
                request_headers:
                  ID: !secret device_id
                  Access-Token: !secret device_token
                  X-Dashboard-View: daily_brief
                  X-Dashboard-Metadata: "true"
                  If-None-Match: !lambda "return id(active_daily_etag).c_str();"
                  Accept: image/png
                collect_headers:
                  - ETag
                  - X-Dashboard-Generation
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: |-
                            return response->status_code == 200 ||
                                   response->status_code == 304;
                        then:
                          - lambda: |-
                              id(daily_metadata_status) = response->status_code;
                              id(daily_generation) = response->get_response_header("X-Dashboard-Generation");
                              id(staged_daily_etag) = response->get_response_header("ETag");
                          - script.execute: request_calendar_metadata
                        else:
                          - logger.log:
                              level: WARN
                              format: "Daily Brief metadata request failed"
                          - script.execute: handle_update_failure
                on_error:
                  then:
                    - script.execute: handle_update_failure
          else:
            - logger.log:
                level: WARN
                format: "View-set request skipped while another update is active"

  - id: request_calendar_metadata
    mode: single
    then:
      - http_request.get:
          url: "${device_origin}/api/image"
          request_headers:
            ID: !secret device_id
            Access-Token: !secret device_token
            X-Dashboard-View: calendar
            X-Dashboard-Metadata: "true"
            If-None-Match: !lambda "return id(active_calendar_etag).c_str();"
            Accept: image/png
          collect_headers:
            - ETag
            - X-Dashboard-Generation
          on_response:
            then:
              - if:
                  condition:
                    lambda: |-
                      const int calendar_status = response->status_code;
                      const std::string calendar_generation =
                          response->get_response_header("X-Dashboard-Generation");
                      return (calendar_status == 200 || calendar_status == 304) &&
                             calendar_generation == id(daily_generation) &&
                             !calendar_generation.empty() &&
                             !id(staged_daily_etag).empty() &&
                             !response->get_response_header("ETag").empty();
                  then:
                    - lambda: |-
                        id(staging_generation) =
                            response->get_response_header("X-Dashboard-Generation");
                        id(staged_calendar_etag) =
                            response->get_response_header("ETag");
                    - if:
                        condition:
                          lambda: |-
                            return id(daily_metadata_status) == 304 &&
                                   response->status_code == 304;
                        then:
                          - script.execute: finish_unchanged_view_set
                        else:
                          - if:
                              condition:
                                lambda: "return id(staging_slot) == 0;"
                              then:
                                - component.update: slot_a_daily_brief
                              else:
                                - component.update: slot_b_daily_brief
                  else:
                    - logger.log:
                        level: WARN
                        format: "View-set metadata is incomplete or mixed-generation"
                    - script.execute: handle_update_failure
          on_error:
            then:
              - script.execute: handle_update_failure

  - id: finish_unchanged_view_set
    mode: single
    then:
      - script.stop: update_timeout
      - lambda: |-
          id(request_finished) = true;
          id(request_started) = false;
      - if:
          condition:
            lambda: "return id(reset_display_to_daily);"
          then:
            - component.update: main_display
      - lambda: "id(reset_display_to_daily) = false;"
      - script.execute: status_led_awake

  - id: activate_staged_view_set
    mode: single
    then:
      - script.stop: update_timeout
      - script.execute: status_led_refreshing
      - script.wait: status_led_refreshing
      - lambda: |-
          id(active_slot) = id(staging_slot);
          id(active_daily_etag) = id(staged_daily_etag);
          id(active_calendar_etag) = id(staged_calendar_etag);
          id(has_active_view_set) = true;
          id(selected_view) = 0;
          id(reset_display_to_daily) = false;
          id(request_finished) = true;
          ESP_LOGW(
              "view_set",
              "Activated generation %s with %lu bytes PSRAM headroom",
              id(staging_generation).c_str(),
              static_cast<unsigned long>(ESP.getFreePsram()));
      - component.update: main_display
      - script.execute: status_led_awake
      - lambda: |-
          id(request_started) = false;

  - id: scheduled_image_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(maintenance_mode);"
          then:
            - lambda: |-
                id(reset_display_to_daily) =
                    id(has_active_view_set) && id(selected_view) != 0;
                id(selected_view) = 0;
            - script.execute: request_view_set_if_ready

  - id: handle_update_failure
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(request_finished);"
          then:
            - script.stop: update_timeout
            - if:
                condition:
                  lambda: "return id(staging_slot) == 0;"
                then:
                  - online_image.release: slot_a_daily_brief
                  - online_image.release: slot_a_calendar
                else:
                  - online_image.release: slot_b_daily_brief
                  - online_image.release: slot_b_calendar
            - if:
                condition:
                  lambda: "return id(reset_display_to_daily);"
                then:
                  - component.update: main_display
            - lambda: "id(reset_display_to_daily) = false;"
            - lambda: "id(request_finished) = true;"
            - script.execute: status_led_error
            - script.wait: status_led_error
            - script.execute: status_led_awake
            - lambda: |-
                id(request_started) = false;

image:
  - platform: online_image
    id: slot_a_daily_brief
    url: "${device_origin}/api/image"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      X-Dashboard-View: daily_brief
      X-Dashboard-Generation: !lambda "return id(staging_generation).c_str();"
      Accept: image/png
    format: PNG
    type: GRAYSCALE
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - component.update: slot_a_calendar
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Daily Brief staging failed"
        - script.execute: handle_update_failure

  - platform: online_image
    id: slot_a_calendar
    url: "${device_origin}/api/image"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      X-Dashboard-View: calendar
      X-Dashboard-Generation: !lambda "return id(staging_generation).c_str();"
      Accept: image/png
    format: PNG
    type: GRAYSCALE
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - script.execute: activate_staged_view_set
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Calendar View staging failed"
        - script.execute: handle_update_failure

  - platform: online_image
    id: slot_b_daily_brief
    url: "${device_origin}/api/image"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      X-Dashboard-View: daily_brief
      X-Dashboard-Generation: !lambda "return id(staging_generation).c_str();"
      Accept: image/png
    format: PNG
    type: GRAYSCALE
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - component.update: slot_b_calendar
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Daily Brief staging failed"
        - script.execute: handle_update_failure

  - platform: online_image
    id: slot_b_calendar
    url: "${device_origin}/api/image"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      X-Dashboard-View: calendar
      X-Dashboard-Generation: !lambda "return id(staging_generation).c_str();"
      Accept: image/png
    format: PNG
    type: GRAYSCALE
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - script.execute: activate_staged_view_set
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Calendar View staging failed"
        - script.execute: handle_update_failure

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: main_display
    model: gdey075t7-gray4-lut
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin: GPIO4
    rotation: 0
    update_interval: never
    lambda: |-
      if (!id(has_active_view_set)) {
        return;
      }
      if (id(active_slot) == 0 && id(selected_view) == 0) {
        it.image(0, 0, id(slot_a_daily_brief));
      } else if (id(active_slot) == 0) {
        it.image(0, 0, id(slot_a_calendar));
      } else if (id(selected_view) == 0) {
        it.image(0, 0, id(slot_b_daily_brief));
      } else {
        it.image(0, 0, id(slot_b_calendar));
      }

binary_sensor:
  - platform: gpio
    id: key1
    internal: true
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - lambda: |-
            id(maintenance_mode) = true;
            id(request_started) = false;
        - script.execute: status_led_awake
        - logger.log:
            level: WARN
            format: "Maintenance mode activated; reset to resume image updates"

  - platform: gpio
    id: key3
    internal: true
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return !id(request_started) &&
                       id(has_active_view_set);
            then:
              - lambda: "id(selected_view) = 1 - id(selected_view);"
              - component.update: main_display
