substitutions:
  device_origin: !secret device_origin

esphome:
  name: family-dashboard
  friendly_name: Family Dashboard ESPHome PoC
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            const esp_sleep_wakeup_cause_t wakeup_cause =
                esp_sleep_get_wakeup_cause();
            id(button_wake) =
                wakeup_cause == ESP_SLEEP_WAKEUP_EXT0 ||
                wakeup_cause == ESP_SLEEP_WAKEUP_EXT1;
            id(update_source) = id(button_wake) ? "button" : "timer";
    - priority: -100
      then:
        - delay: 75s
        - script.execute: sleep_without_update

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: request_manifest_if_ready

logger:
  level: WARN

http_request:
  id: dashboard_http
  follow_redirects: false
  timeout: 10s
  verify_ssl: true
  buffer_size_rx: 1024

globals:
  - id: refresh_seconds
    type: uint32_t
    restore_value: false
    initial_value: "900"
  - id: request_finished
    type: bool
    restore_value: false
    initial_value: "false"
  - id: request_started
    type: bool
    restore_value: false
    initial_value: "false"
  - id: button_wake
    type: bool
    restore_value: false
    initial_value: "false"
  - id: button_armed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: button_gesture_complete
    type: bool
    restore_value: false
    initial_value: "false"
  - id: update_source
    type: std::string
    restore_value: false
    initial_value: '"timer"'

deep_sleep:
  id: dashboard_sleep
  wakeup_pin:
    number: GPIO5
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

script:
  - id: button_click_window
    mode: restart
    then:
      - delay: 750ms
      - if:
          condition:
            lambda: "return !id(button_gesture_complete);"
          then:
            - lambda: "id(button_armed) = false;"

  - id: request_manifest_if_ready
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(request_started) &&
                     (!id(button_wake) || id(button_gesture_complete));
          then:
            - lambda: "id(request_started) = true;"
            - script.execute: fetch_manifest

  - id: fetch_manifest
    mode: single
    then:
      - http_request.get:
          url: "${device_origin}/api/display"
          request_headers:
            ID: !secret device_id
            Access-Token: !secret device_token
            Update-Source: !lambda "return id(update_source).c_str();"
            Accept: application/json
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("daily_brief", "Manifest rejected: HTTP status");
                    id(sleep_without_update).execute();
                    return;
                  }

                  bool valid = json::parse_json(body, [](JsonObject root) -> bool {
                    if (!root["status"].is<int>() || root["status"].as<int>() != 0 ||
                        !root["image_url"].is<const char *>() ||
                        !root["filename"].is<const char *>() ||
                        !root["refresh_rate"].is<int>()) {
                      return false;
                    }

                    const std::string origin = "${device_origin}";
                    const std::string image_url = root["image_url"].as<const char *>();
                    const std::string filename = root["filename"].as<const char *>();
                    const int refresh_rate = root["refresh_rate"].as<int>();

                    if (origin.rfind("https://", 0) != 0 ||
                        origin.find('/', 8) != std::string::npos ||
                        origin.find('@') != std::string::npos ||
                        origin.find('?') != std::string::npos ||
                        origin.find('#') != std::string::npos ||
                        filename.empty() ||
                        filename.find('/') != std::string::npos ||
                        filename.find('\\') != std::string::npos ||
                        filename.find('?') != std::string::npos ||
                        filename.find('#') != std::string::npos ||
                        refresh_rate < 1 || refresh_rate > 86400) {
                      return false;
                    }

                    const std::string expected_image_url =
                        origin + "/images/" + filename;
                    if (image_url != expected_image_url) {
                      return false;
                    }

                    id(refresh_seconds) = static_cast<uint32_t>(refresh_rate);
                    id(dashboard_image).set_url(image_url);
                    return true;
                  });

                  if (!valid) {
                    ESP_LOGW("daily_brief", "Manifest rejected: invalid contract");
                    id(sleep_without_update).execute();
                    return;
                  }

                  id(dashboard_image).update();
          on_error:
            then:
              - logger.log:
                  level: WARN
                  format: "Manifest request failed"
              - script.execute: sleep_without_update

  - id: sleep_without_update
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(request_finished);"
          then:
            - lambda: "id(request_finished) = true;"
            - deep_sleep.enter:
                id: dashboard_sleep
                sleep_duration: !lambda "return id(refresh_seconds) * 1000;"

image:
  - platform: online_image
    id: dashboard_image
    url: "${device_origin}/images/not-requested.png"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      Accept: image/png
    format: PNG
    type: BINARY
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - lambda: "id(request_finished) = true;"
        - component.update: main_display
        - online_image.release: dashboard_image
        - deep_sleep.enter:
            id: dashboard_sleep
            sleep_duration: !lambda "return id(refresh_seconds) * 1000;"
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Image download or decode failed"
        - script.execute: sleep_without_update

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: main_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    rotation: 0°
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

binary_sensor:
  - platform: gpio
    id: key3
    internal: true
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(button_wake) && id(button_armed) &&
                       !id(button_gesture_complete);
            then:
              - lambda: |-
                  id(button_gesture_complete) = true;
                  id(button_armed) = false;
              - script.stop: button_click_window
              - if:
                  condition:
                    wifi.connected:
                  then:
                    - script.execute: request_manifest_if_ready
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return id(button_wake) && !id(button_gesture_complete);
            then:
              - lambda: "id(button_armed) = true;"
              - script.execute: button_click_window
