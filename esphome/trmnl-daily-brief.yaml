substitutions:
  device_origin: !secret device_origin

esphome:
  name: family-dashboard
  friendly_name: Family Dashboard
  on_boot:
    - priority: 800
      then:
        - script.execute: status_led_awake
        - lambda: |-
            pinMode(2, INPUT_PULLUP);
            id(maintenance_mode) = digitalRead(2) == LOW;
            id(update_source) = "timer";
    - priority: -100
      then:
        - if:
            condition:
              lambda: "return id(maintenance_mode);"
            then:
              - logger.log:
                  level: WARN
                  format: "Maintenance mode active; deep sleep is disabled"
            else:
              - delay: 75s
              - script.execute: handle_update_failure

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - script.execute: request_image_if_ready

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: dashboard_time
    timezone: America/Los_Angeles
    on_time:
      - seconds: 0
        minutes: 32
        hours: 6,10
        then:
          - script.execute: scheduled_image_refresh
      - seconds: 0
        minutes: 2
        hours: 15,19
        then:
          - script.execute: scheduled_image_refresh

output:
  - platform: gpio
    id: status_led
    # GPIO21 is also the XIAO Plus microSD chip-select; keep the slot empty.
    pin:
      number: GPIO21
      inverted: true

logger:
  level: WARN

http_request:
  id: dashboard_http
  follow_redirects: false
  timeout: 10s
  verify_ssl: true
  buffer_size_rx: 1024

globals:
  - id: request_finished
    type: bool
    restore_value: false
    initial_value: "false"
  - id: request_started
    type: bool
    restore_value: false
    initial_value: "false"
  - id: button_armed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: button_gesture_complete
    type: bool
    restore_value: false
    initial_value: "false"
  - id: update_source
    type: std::string
    restore_value: false
    initial_value: '"timer"'
  - id: maintenance_mode
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: status_led_fast_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: "return true;"
          then:
            - output.turn_on: status_led
            - delay: 100ms
            - output.turn_off: status_led
            - delay: 100ms

  - id: status_led_awake
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - output.turn_on: status_led

  - id: status_led_downloading
    mode: restart
    then:
      - script.execute: status_led_fast_blink

  - id: status_led_refreshing
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - output.turn_on: status_led

  - id: status_led_error
    mode: restart
    then:
      - script.stop: status_led_fast_blink
      - repeat:
          count: 3
          then:
            - output.turn_on: status_led
            - delay: 120ms
            - output.turn_off: status_led
            - delay: 120ms

  - id: button_click_window
    mode: restart
    then:
      - delay: 750ms
      - if:
          condition:
            lambda: "return !id(button_gesture_complete);"
          then:
            - lambda: "id(button_armed) = false;"

  - id: request_image_if_ready
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return !id(maintenance_mode) &&
                     !id(request_started) &&
                     (id(update_source) == "timer" ||
                      id(button_gesture_complete));
          then:
            - lambda: "id(request_started) = true;"
            - script.execute: status_led_downloading
            - component.update: dashboard_image

  - id: scheduled_image_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(maintenance_mode);"
          then:
            - lambda: |-
                id(update_source) = "timer";
                id(request_started) = false;
                id(request_finished) = false;
                id(button_armed) = false;
                id(button_gesture_complete) = false;
            - script.execute: request_image_if_ready

  - id: handle_update_failure
    mode: single
    then:
      - if:
          condition:
            lambda: "return !id(request_finished);"
          then:
            - lambda: "id(request_finished) = true;"
            - script.execute: status_led_error
            - script.wait: status_led_error
            - script.execute: status_led_awake
            - lambda: |-
                id(request_started) = false;
                id(button_armed) = false;
                id(button_gesture_complete) = false;

image:
  - platform: online_image
    id: dashboard_image
    url: "${device_origin}/api/image"
    request_headers:
      ID: !secret device_id
      Access-Token: !secret device_token
      Update-Source: !lambda "return id(update_source).c_str();"
      Accept: image/png
    format: PNG
    type: BINARY
    resize: 800x480
    buffer_size: 16384
    update_interval: never
    on_download_finished:
      then:
        - lambda: "id(request_finished) = true;"
        - if:
            condition:
              lambda: "return !cached;"
            then:
              - script.execute: status_led_refreshing
              - script.wait: status_led_refreshing
              - component.update: main_display
        - online_image.release: dashboard_image
        - script.execute: status_led_awake
        - lambda: |-
            id(request_started) = false;
            id(button_armed) = false;
            id(button_gesture_complete) = false;
    on_error:
      then:
        - logger.log:
            level: WARN
            format: "Image download or decode failed"
        - script.execute: handle_update_failure

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: main_display
    model: 7.50inv2
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin:
      number: GPIO4
      inverted: true
    rotation: 0°
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image), COLOR_OFF, COLOR_ON);

binary_sensor:
  - platform: gpio
    id: key1
    internal: true
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - lambda: |-
            id(maintenance_mode) = true;
            id(request_started) = false;
            id(button_armed) = false;
            id(button_gesture_complete) = false;
        - script.execute: status_led_awake
        - logger.log:
            level: WARN
            format: "Maintenance mode activated; reset to resume image updates"

  - platform: gpio
    id: key3
    internal: true
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - if:
            condition:
              lambda: |-
                return id(button_armed) &&
                       !id(button_gesture_complete) &&
                       !id(request_started);
            then:
              - lambda: |-
                  id(button_gesture_complete) = true;
                  id(button_armed) = false;
                  id(update_source) = "button";
              - script.stop: button_click_window
              - if:
                  condition:
                    wifi.connected:
                  then:
                    - script.execute: request_image_if_ready
    on_release:
      then:
        - if:
            condition:
              lambda: |-
                return !id(button_gesture_complete) &&
                       !id(request_started);
            then:
              - lambda: "id(button_armed) = true;"
              - script.execute: button_click_window
