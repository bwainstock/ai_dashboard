name = "family-dashboard-device"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "family-dashboard"
database_id = "8de2d03d-5ff3-4d36-ac31-2e3af4f326b7"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "family-dashboard-private-images"

[[send_email]]
name = "INCIDENT_EMAIL"
destination_address = "operator@example.com"

[vars]
ADMIN_ORIGIN = "https://dashboard-admin.example.com"
OPERATIONAL_EMAIL_FROM = "dashboard@example.com"
OPERATIONAL_EMAIL_TO = "operator@example.com"
MAX_IMAGE_BYTES = "1000000"
GENERATION_RETRY_MINUTES = "15"
NOTICE_GRACE_DAYS = "3"

# Set GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, and CALENDAR_TOKEN_ENCRYPTION_KEY
# with `wrangler secret put`; never place OAuth credentials in this file.
# Replace the operational email placeholders with Email Routing-verified
# addresses before deployment.
# Route ADMIN_ORIGIN through a Cloudflare Access application. Route the device
# hostname separately without an interactive Access policy.

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
persist = true
